<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Steam Library & Official Tags Explorer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #171a21;
      color: #c6d4df;
      padding: 20px;
      min-height: 100vh;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    header h1 {
      color: #66c0f4;
      font-size: 2.2rem;
      margin-bottom: 8px;
    }

    header p {
      color: #8f98a0;
      font-size: 0.95rem;
    }

    .panel {
      background-color: #1b2838;
      border: 1px solid #2a475e;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }

    .search-group {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: flex-end;
    }

    .input-box {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
      min-width: 220px;
    }

    .input-box label {
      font-size: 0.85rem;
      color: #66c0f4;
      font-weight: bold;
    }

    input, select {
      background-color: #0d121a;
      border: 1px solid #2a475e;
      color: #ffffff;
      padding: 10px 14px;
      border-radius: 5px;
      outline: none;
      font-size: 0.95rem;
    }

    input:focus, select:focus {
      border-color: #66c0f4;
    }

    button {
      background: linear-gradient(90deg, #47bfff 0%, #1a9fff 100%);
      color: white;
      border: none;
      padding: 11px 22px;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.95rem;
      transition: opacity 0.2s, transform 0.1s;
      height: 42px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      background: #2a475e;
      cursor: not-allowed;
      color: #8f98a0;
    }

    .btn-export {
      background: linear-gradient(90deg, #a3e035 0%, #87bc27 100%);
      color: #0d121a;
    }

    .status-box {
      background-color: #0d121a;
      border: 1px dashed #2a475e;
      padding: 14px 18px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 0.9rem;
      color: #66c0f4;
      display: none;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .summary-card {
      background-color: #1b2838;
      border: 1px solid #2a475e;
      border-radius: 8px;
      padding: 16px;
      text-align: center;
    }

    .summary-card h3 {
      font-size: 0.8rem;
      color: #8f98a0;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .summary-card .val {
      font-size: 1.6rem;
      font-weight: bold;
      color: #a3e035;
    }

    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 18px;
    }

    .game-card {
      background-color: #1b2838;
      border: 1px solid #2a475e;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, border-color 0.2s;
    }

    .game-card:hover {
      transform: translateY(-4px);
      border-color: #66c0f4;
    }

    .game-banner {
      width: 100%;
      height: 125px;
      object-fit: cover;
      background-color: #0d121a;
    }

    .game-info {
      padding: 14px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .game-title {
      font-size: 1rem;
      font-weight: bold;
      color: #ffffff;
      margin-bottom: 6px;
      line-height: 1.25;
    }

    .game-playtime {
      font-size: 0.8rem;
      color: #a3e035;
      margin-bottom: 10px;
    }

    .tag-container {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: auto;
    }

    .tag-pill {
      background-color: #2a475e;
      color: #66c0f4;
      font-size: 0.72rem;
      padding: 3px 8px;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      user-select: none;
    }

    .tag-pill:hover {
      background-color: #66c0f4;
      color: #0d121a;
      transform: scale(1.05);
    }

    .tag-pill.cat {
      background-color: #1e3a5f;
      color: #c6d4df;
    }

    .tag-pill.cat:hover {
      background-color: #3b628c;
      color: #ffffff;
    }

    .tag-pill.fallback {
      background-color: #3a2e1e;
      color: #facc15;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🎮 Explorador de Juegos y Tags de Steam</h1>
      <p>Consulta todos los juegos de tu cuenta, descubre sus etiquetas/géneros y expórtalos</p>
    </header>

    <div class="panel">
      <div class="search-group">
        <div class="input-box">
          <label for="steamInput">Usuario o ID de Steam:</label>
          <input type="text" id="steamInput" placeholder="Ejemplo: gabo459, 76561198... o URL de perfil">
        </div>
        <button id="btnSearch" onclick="fetchLibrary()">🔍 Consultar Biblioteca</button>
        <button id="btnRetryMissing" onclick="retryMissingTags()" style="background: #1e3a5f; color: #66c0f4;" title="Vuelve a consultar solo los juegos sin etiquetas">🔄 Reconsultar Faltantes</button>
        <button id="btnClearCache" onclick="clearCache()" style="background: #3a1e1e; color: #ff8888;" title="Borra toda la memoria guardada localmente">🗑️ Limpiar Caché</button>
      </div>
    </div>

    <div class="status-box" id="statusBox">Esperando consulta...</div>

    <div id="statsSection" style="display: none;">
      <div class="summary-grid">
        <div class="summary-card">
          <h3>Total de Juegos</h3>
          <div class="val" id="statTotal" style="color: #66c0f4;">0</div>
        </div>
        <div class="summary-card">
          <h3>Horas Totales Jugadas</h3>
          <div class="val" id="statHours">0 hrs</div>
        </div>
        <div class="summary-card">
          <h3>Juegos Jugados</h3>
          <div class="val" id="statPlayed" style="color: #ffffff;">0</div>
        </div>
      </div>

      <div class="panel filter-bar">
        <div style="display: flex; gap: 10px; flex: 2; min-width: 280px; flex-wrap: wrap;">
          <input type="text" id="filterText" placeholder="Buscar por nombre de juego..." oninput="applyFilters()" style="flex: 1; min-width: 200px;">
          
          <!-- Filtro oficial con las 300+ etiquetas de Steam -->
          <select id="tagSelect" onchange="applyFilters()" style="flex: 1; min-width: 220px; max-width: 320px;">
            <option value="">🏷️ Seleccionar etiqueta de Steam (300+)...</option>
          </select>
        </div>
        
        <div style="display: flex; gap: 10px;">
          <button class="btn-export" onclick="exportCSV()">📊 Exportar CSV</button>
          <button class="btn-export" style="background: #2a475e; color: #fff;" onclick="exportTXT()">📄 Exportar TXT</button>
        </div>
      </div>
    </div>

    <div class="games-grid" id="gamesGrid"></div>
  </div>

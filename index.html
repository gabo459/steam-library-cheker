<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Steam Library & Official Tags Explorer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #171a21;
      color: #c6d4df;
      padding: 20px;
      min-height: 100vh;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    header h1 {
      color: #66c0f4;
      font-size: 2.2rem;
      margin-bottom: 8px;
    }

    header p {
      color: #8f98a0;
      font-size: 0.95rem;
    }

    .panel {
      background-color: #1b2838;
      border: 1px solid #2a475e;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }

    .search-group {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: flex-end;
    }

    .input-box {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
      min-width: 220px;
    }

    .input-box label {
      font-size: 0.85rem;
      color: #66c0f4;
      font-weight: bold;
    }

    input, select {
      background-color: #0d121a;
      border: 1px solid #2a475e;
      color: #ffffff;
      padding: 10px 14px;
      border-radius: 5px;
      outline: none;
      font-size: 0.95rem;
    }

    input:focus, select:focus {
      border-color: #66c0f4;
    }

    button {
      background: linear-gradient(90deg, #47bfff 0%, #1a9fff 100%);
      color: white;
      border: none;
      padding: 11px 22px;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.95rem;
      transition: opacity 0.2s, transform 0.1s;
      height: 42px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      background: #2a475e;
      cursor: not-allowed;
      color: #8f98a0;
    }

    .btn-export {
      background: linear-gradient(90deg, #a3e035 0%, #87bc27 100%);
      color: #0d121a;
    }

    .status-box {
      background-color: #0d121a;
      border: 1px dashed #2a475e;
      padding: 14px 18px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 0.9rem;
      color: #66c0f4;
      display: none;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .summary-card {
      background-color: #1b2838;
      border: 1px solid #2a475e;
      border-radius: 8px;
      padding: 16px;
      text-align: center;
    }

    .summary-card h3 {
      font-size: 0.8rem;
      color: #8f98a0;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .summary-card .val {
      font-size: 1.6rem;
      font-weight: bold;
      color: #a3e035;
    }

    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 18px;
    }

    .game-card {
      background-color: #1b2838;
      border: 1px solid #2a475e;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, border-color 0.2s;
    }

    .game-card:hover {
      transform: translateY(-4px);
      border-color: #66c0f4;
    }

    .game-banner {
      width: 100%;
      height: 125px;
      object-fit: cover;
      background-color: #0d121a;
    }

    .game-info {
      padding: 14px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .game-title {
      font-size: 1rem;
      font-weight: bold;
      color: #ffffff;
      margin-bottom: 6px;
      line-height: 1.25;
    }

    .game-playtime {
      font-size: 0.8rem;
      color: #a3e035;
      margin-bottom: 10px;
    }

    .tag-container {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: auto;
    }

    .tag-pill {
      background-color: #2a475e;
      color: #66c0f4;
      font-size: 0.72rem;
      padding: 3px 8px;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      user-select: none;
    }

    .tag-pill:hover {
      background-color: #66c0f4;
      color: #0d121a;
      transform: scale(1.05);
    }

    .tag-pill.cat {
      background-color: #1e3a5f;
      color: #c6d4df;
    }

    .tag-pill.cat:hover {
      background-color: #3b628c;
      color: #ffffff;
    }

    .tag-pill.fallback {
      background-color: #3a2e1e;
      color: #facc15;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🎮 Explorador de Juegos y Tags de Steam</h1>
      <p>Consulta todos los juegos de tu cuenta, descubre sus etiquetas/géneros y expórtalos</p>
    </header>

    <div class="panel">
      <div class="search-group">
        <div class="input-box">
          <label for="steamInput">Usuario o ID de Steam:</label>
          <input type="text" id="steamInput" placeholder="Ejemplo: gabo459, 76561198... o URL de perfil">
        </div>
        <button id="btnSearch" onclick="fetchLibrary()">🔍 Consultar Biblioteca</button>
        <button id="btnRetryMissing" onclick="retryMissingTags()" style="background: #1e3a5f; color: #66c0f4;" title="Vuelve a consultar solo los juegos sin etiquetas">🔄 Reconsultar Faltantes</button>
        <button id="btnClearCache" onclick="clearCache()" style="background: #3a1e1e; color: #ff8888;" title="Borra toda la memoria guardada localmente">🗑️ Limpiar Caché</button>
      </div>
    </div>

    <div class="status-box" id="statusBox">Esperando consulta...</div>

    <div id="statsSection" style="display: none;">
      <div class="summary-grid">
        <div class="summary-card">
          <h3>Total de Juegos</h3>
          <div class="val" id="statTotal" style="color: #66c0f4;">0</div>
        </div>
        <div class="summary-card">
          <h3>Horas Totales Jugadas</h3>
          <div class="val" id="statHours">0 hrs</div>
        </div>
        <div class="summary-card">
          <h3>Juegos Jugados</h3>
          <div class="val" id="statPlayed" style="color: #ffffff;">0</div>
        </div>
      </div>

      <div class="panel filter-bar">
        <div style="display: flex; gap: 10px; flex: 2; min-width: 280px; flex-wrap: wrap;">
          <input type="text" id="filterText" placeholder="Buscar por nombre de juego..." oninput="applyFilters()" style="flex: 1; min-width: 200px;">
          
          <!-- Filtro oficial con las 300+ etiquetas de Steam -->
          <select id="tagSelect" onchange="applyFilters()" style="flex: 1; min-width: 220px; max-width: 320px;">
            <option value="">🏷️ Seleccionar etiqueta de Steam (300+)...</option>
          </select>
        </div>
        
        <div style="display: flex; gap: 10px;">
          <button class="btn-export" onclick="exportCSV()">📊 Exportar CSV</button>
          <button class="btn-export" style="background: #2a475e; color: #fff;" onclick="exportTXT()">📄 Exportar TXT</button>
        </div>
      </div>
    </div>

    <div class="games-grid" id="gamesGrid"></div>
  </div>

    // Poblar el selector desplegable con las 300+ etiquetas
    function initTagDropdown() {
      const select = document.getElementById('tagSelect');
      select.innerHTML = '<option value="">🏷️ Todas las etiquetas (300+ de SteamDB)...</option>';

      // Ordenar alfabéticamente por nombre
      const sorted = [...OFFICIAL_STEAM_TAGS].sort((a, b) => a.name.localeCompare(b.name));

      sorted.forEach(tag => {
        const opt = document.createElement('option');
        opt.value = tag.name;
        opt.textContent = tag.iconName;
        select.appendChild(opt);
      });
    }

    // --- FUNCIONES DE CACHÉ LOCAL ---
    function getCache() {
      try {
        const stored = localStorage.getItem(CACHE_KEY);
        return stored ? JSON.parse(stored) : {};
      } catch (e) {
        return {};
      }
    }

    function saveToCache(appid, tags, categories) {
      try {
        const cache = getCache();
        cache[appid] = { tags, categories, timestamp: Date.now() };
        localStorage.setItem(CACHE_KEY, JSON.stringify(cache));
      } catch (e) {
        console.warn("No se pudo guardar en localStorage:", e);
      }
    }

    function clearCache() {
      if (confirm("¿Deseas eliminar la memoria de etiquetas guardadas en este navegador?")) {
        localStorage.removeItem(CACHE_KEY);
        alert("Caché borrada correctamente.");
      }
    }

    function retryMissingTags() {
      const cache = getCache();
      let clearedCount = 0;

      allGames.forEach(g => {
        if (!g.tags || g.tags.length === 0 || g.tags.includes("Sin Ficha en Tienda")) {
          delete cache[g.appid];
          g.loadedDetails = false;
          g.tags = [];
          g.categories = [];
          clearedCount++;
        }
      });

      localStorage.setItem(CACHE_KEY, JSON.stringify(cache));

      if (clearedCount === 0) {
        alert("Todos los juegos ya poseen etiquetas asignadas.");
        return;
      }

      const pendingGames = allGames.filter(g => !g.loadedDetails);
      const statusBox = document.getElementById('statusBox');
      statusBox.style.display = "block";
      statusBox.textContent = `🔄 Reconsultando ${pendingGames.length} juegos sin etiquetas...`;

      fetchTagsForBatch(pendingGames, statusBox);
    }

    async function resolveSteamId(input) {
      let clean = input.trim();
      if (/^\d{17}$/.test(clean)) return clean;

      const profileMatch = clean.match(/steamcommunity\.com\/profiles\/(\d{17})/);
      if (profileMatch) return profileMatch[1];

      let customName = clean
        .split('?')[0]
        .replace(/https?:\/\/steamcommunity\.com\/id\//, '')
        .replace(/\//g, '')
        .trim();

      if (!customName) return null;

      const res = await fetch(`${WORKER_URL}/?action=resolve&vanity=${encodeURIComponent(customName)}`);
      const data = await res.json();

      if (data.response && data.response.success === 1) {
        return data.response.steamid;
      } else {
        throw new Error(`No se pudo encontrar un SteamID64 para '${customName}'.`);
      }
    }

    async function fetchLibrary() {
      const input = document.getElementById('steamInput').value;
      const statusBox = document.getElementById('statusBox');
      const btn = document.getElementById('btnSearch');

      if (!input.trim()) {
        alert("Ingresa un usuario o ID de Steam.");
        return;
      }

      btn.disabled = true;
      statusBox.style.display = "block";
      statusBox.textContent = "🔍 Resolviendo ID de Steam...";
      document.getElementById('statsSection').style.display = "none";
      document.getElementById('gamesGrid').innerHTML = "";

      try {
        const steamId = await resolveSteamId(input);
        statusBox.textContent = `⏳ Obteniendo biblioteca de juegos para SteamID: ${steamId}...`;

        const res = await fetch(`${WORKER_URL}/?action=owned_games&steamid=${steamId}`);
        const data = await res.json();

        if (!data.response || !data.response.games) {
          throw new Error("No se pudieron obtener los juegos. Verifica que el perfil y la biblioteca sean PÚBLICOS.");
        }

        let rawGames = data.response.games;
        rawGames.sort((a, b) => b.playtime_forever - a.playtime_forever);

        const cache = getCache();
        const pendingGames = [];

        allGames = rawGames.map(g => {
          const cachedEntry = cache[g.appid];
          const isValidCached = cachedEntry && cachedEntry.tags && cachedEntry.tags.length > 0;

          return {
            appid: g.appid,
            name: g.name,
            playtime: (g.playtime_forever / 60).toFixed(1),
            imgUrl: `https://cdn.akamai.steamstatic.com/steam/apps/${g.appid}/header.jpg`,
            tags: isValidCached ? cachedEntry.tags : [],
            categories: isValidCached ? cachedEntry.categories : [],
            loadedDetails: isValidCached
          };
        });

        allGames.forEach(g => {
          if (!g.loadedDetails) pendingGames.push(g);
        });

        let totalHours = allGames.reduce((acc, g) => acc + parseFloat(g.playtime), 0);
        let playedCount = allGames.filter(g => parseFloat(g.playtime) > 0).length;

        document.getElementById('statTotal').textContent = allGames.length;
        document.getElementById('statHours').textContent = `${totalHours.toFixed(0)} hrs`;
        document.getElementById('statPlayed').textContent = playedCount;
        document.getElementById('statsSection').style.display = "block";

        filteredGames = [...allGames];
        renderGrid();

        const cachedCount = allGames.length - pendingGames.length;

        if (pendingGames.length === 0) {
          statusBox.textContent = `⚡ ¡Carga instantánea! Se recuperaron los datos de los ${allGames.length} juegos desde la caché local.`;
        } else {
          statusBox.textContent = `📦 Se cargaron ${cachedCount} juegos desde la caché. Obteniendo etiquetas de ${pendingGames.length} juegos nuevos o incompletos...`;
          await fetchTagsForBatch(pendingGames, statusBox);
        }

      } catch (err) {
        statusBox.textContent = `❌ Error: ${err.message}`;
      } finally {
        btn.disabled = false;
      }
    }

    async function fetchTagsForBatch(gamesList, statusBox) {
      let count = 0;
      for (const game of gamesList) {
        count++;
        statusBox.textContent = `⏳ Obteniendo etiquetas de juegos (${count}/${gamesList.length}): ${game.name}...`;

        let retries = 0;
        let success = false;

        while (!success && retries < 2) {
          try {
            const res = await fetch(`${WORKER_URL}/?action=app_details&appid=${game.appid}`);
            
            if (res.status === 429) {
              statusBox.textContent = `⏳ Pausa anti-bloqueo de Steam... reanudando en 2s (${count}/${gamesList.length})`;
              await new Promise(r => setTimeout(r, 2000));
              retries++;
              continue;
            }

            if (res.ok) {
              const data = await res.json();
              
              if (data && data[game.appid] && data[game.appid].success && data[game.appid].data) {
                const details = data[game.appid].data;
                let genresList = details.genres ? details.genres.map(g => g.description) : [];
                let categoriesList = details.categories ? details.categories.slice(0, 3).map(c => c.description) : [];

                if (genresList.length === 0 && details.type) {
                  const typeMap = {
                    'dlc': 'DLC / Expansión',
                    'music': 'Banda Sonora',
                    'demo': 'Demostración',
                    'mod': 'Modificación',
                    'video': 'Video',
                    'application': 'Software / Herramienta'
                  };
                  if (typeMap[details.type]) {
                    genresList.push(typeMap[details.type]);
                  }
                }

                game.tags = genresList.length > 0 ? genresList : ["General"];
                game.categories = categoriesList;

              } else {
                game.tags = ["Sin Ficha en Tienda"];
                game.categories = [];
              }

              saveToCache(game.appid, game.tags, game.categories);
              success = true;
            }
          } catch (e) {
            console.warn(`Error al consultar ${game.name}`);
          }
          retries++;
        }

        game.loadedDetails = true;

        if (count % 3 === 0 || count === gamesList.length) {
          applyFilters();
        }

        await new Promise(r => setTimeout(r, 150));
      }

      statusBox.textContent = `✅ Carga completada. Se asignaron etiquetas a todos los juegos procesados.`;
    }

    function filterByTag(tag) {
      const select = document.getElementById('tagSelect');
      // Intentar hacer match directo
      let found = Array.from(select.options).find(opt => opt.value.toLowerCase() === tag.toLowerCase());
      
      if (found) {
        select.value = found.value;
      } else {
        // Si la etiqueta no está en la lista oficial estándar, buscar en texto
        document.getElementById('filterText').value = tag;
      }
      applyFilters();
    }

    function renderGrid() {
      const grid = document.getElementById('gamesGrid');
      grid.innerHTML = "";

      filteredGames.forEach(game => {
        const card = document.createElement('div');
        card.className = 'game-card';

        const tagsHtml = game.tags.map(t => {
          const isFallback = t === "Sin Ficha en Tienda" || t === "General";
          return `<span class="tag-pill ${isFallback ? 'fallback' : ''}" onclick="filterByTag('${t.replace(/'/g, "\\'")}')">${t}</span>`;
        }).join('');

        const catsHtml = game.categories.map(c => `<span class="tag-pill cat" onclick="filterByTag('${c.replace(/'/g, "\\'")}')">${c}</span>`).join('');

        card.innerHTML = `
          <img class="game-banner" src="${game.imgUrl}" onerror="this.src='https://via.placeholder.com/460x215/1b2838/66c0f4?text=${encodeURIComponent(game.name)}'" alt="${game.name}">
          <div class="game-info">
            <div class="game-title">${game.name}</div>
            <div class="game-playtime">⏱️ ${game.playtime} horas jugadas</div>
            <div class="tag-container">
              ${tagsHtml}
              ${catsHtml}
              ${(!game.loadedDetails) ? '<span style="font-size: 0.7rem; color: #8f98a0;">Cargando etiquetas...</span>' : ''}
            </div>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    function applyFilters() {
      const query = document.getElementById('filterText').value.toLowerCase().trim();
      const selectedTag = document.getElementById('tagSelect').value.toLowerCase().trim();

      filteredGames = allGames.filter(g => {
        const matchText = !query || 
          g.name.toLowerCase().includes(query) ||
          g.tags.some(t => t.toLowerCase().includes(query)) ||
          g.categories.some(c => c.toLowerCase().includes(query));

        const matchTag = !selectedTag || 
          g.tags.some(t => t.toLowerCase().includes(selectedTag) || selectedTag.includes(t.toLowerCase())) ||
          g.categories.some(c => c.toLowerCase().includes(selectedTag) || selectedTag.includes(c.toLowerCase()));

        return matchText && matchTag;
      });

      renderGrid();
    }

    function exportCSV() {
      if (allGames.length === 0) return alert("No hay juegos para exportar.");

      let csvContent = "\uFEFF";
      csvContent += "AppID,Título,Horas Jugadas,Géneros,Categorías,Enlace Tienda\n";

      allGames.forEach(g => {
        const titleEscaped = `"${g.name.replace(/"/g, '""')}"`;
        const genresEscaped = `"${g.tags.join(', ')}"`;
        const catsEscaped = `"${g.categories.join(', ')}"`;
        const storeLink = `https://store.steampowered.com/app/${g.appid}`;

        csvContent += `${g.appid},${titleEscaped},${g.playtime},${genresEscaped},${catsEscaped},${storeLink}\n`;
      });

      downloadFile(csvContent, "steam_library.csv", "text/csv;charset=utf-8;");
    }

    function exportTXT() {
      if (allGames.length === 0) return alert("No hay juegos para exportar.");

      let txtContent = `===============================================\n`;
      txtContent += `      REPORTE DE BIBLIOTECA DE STEAM          \n`;
      txtContent += `===============================================\n\n`;

      allGames.forEach((g, index) => {
        txtContent += `${index + 1}. ${g.name}\n`;
        txtContent += `   - App ID: ${g.appid}\n`;
        txtContent += `   - Tiempo Jugado: ${g.playtime} horas\n`;
        if (g.tags.length > 0) txtContent += `   - Géneros: ${g.tags.join(', ')}\n`;
        if (g.categories.length > 0) txtContent += `   - Categorías: ${g.categories.join(', ')}\n`;
        txtContent += `   - Tienda: https://store.steampowered.com/app/${g.appid}\n\n`;
      });

      downloadFile(txtContent, "steam_library.txt", "text/plain;charset=utf-8;");
    }

    function downloadFile(content, fileName, mimeType) {
      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // Inicializar desplegable al cargar la página
    window.addEventListener('DOMContentLoaded', initTagDropdown);
  </script>
</body>
